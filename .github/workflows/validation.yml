name: Validation

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply pending Phase 6 repair
        if: github.event_name == 'push' && github.ref_name == 'codex/milestone-6-deep-game' && hashFiles('scripts/phase6-ci-fix.mjs') != ''
        run: |
          node scripts/phase6-ci-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: stabilize Phase 6 validation"
          git push origin HEAD:${{ github.ref_name }}
      - run: npm ci
      - name: Verify authored sprites
        run: npm run assets:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser engines
        run: npx playwright install chromium webkit --with-deps
      - name: Browser smoke test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
