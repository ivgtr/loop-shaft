name: UI review workspace
on:
  push:
    branches: ['codex/facility-ui-refinement']
    paths: ['.github/workflows/ui-review-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package tracked sources and installed dependencies only
        run: |
          git archive HEAD | tar -x -C "$(mktemp -d)"
          git archive --format=tar HEAD > /tmp/ui-review-workspace.tar
          tar --append --file=/tmp/ui-review-workspace.tar node_modules
          gzip /tmp/ui-review-workspace.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-workspace
          path: /tmp/ui-review-workspace.tar.gz
          retention-days: 1
