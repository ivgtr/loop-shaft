name: Prepare stage 3 UI corrections
on:
  push:
    branches: [codex/canvas-management]
    paths: [.github/workflows/ui-stage3-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create corrected commit without advancing the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/ivgtr/loop-shaft/git/blobs/cb8038957449098318c398243cf6774f95f9dd06 --jq '.content' | base64 -d > /tmp/fix.patch
          echo '3348b336acaaf06fedd18896065ef18826496fbf85767d757dfc9a080cfd646b  /tmp/fix.patch' | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          rm .github/workflows/ui-stage3-fix.yml
          git diff --check
          python - <<'PY'
          import json, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(endpoint, data):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/ivgtr/loop-shaft/git/' + endpoint, '--method', 'POST', '--input', '-'], input=json.dumps(data), text=True))
          entries = []
          for path in git('diff', '--name-only').splitlines():
              file = pathlib.Path(path)
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if file.exists():
                  entry['content'] = file.read_text()
              else:
                  entry['sha'] = None
              entries.append(entry)
          tree = api('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          commit = api('commits', {'message': 'fix: preserve facility navigation and safe confirmation focus', 'tree': tree['sha'], 'parents': [git('rev-parse', 'HEAD')]})
          print('PREPARED_COMMIT=' + commit['sha'])
          print('PREPARED_TREE=' + tree['sha'])
          PY
