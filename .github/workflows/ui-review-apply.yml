name: Apply verified facility UI changes
on:
  push:
    branches: ['codex/facility-ui-refinement']
    paths: ['.github/ui-review-ready']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/facility-ui-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply locally tested source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path('.github/ui-review-part-1'), pathlib.Path('.github/ui-review-part-2')]
          payload = ''.join(p.read_text().strip() for p in parts)
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '48f305c7181e948961b1fe38f0da4f0d96f2d95e4c26f7c72f784bb65a96b7ca', 'Patch checksum mismatch'
          target = pathlib.Path('/tmp/facility-ui-review.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(target)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(target)], check=True)
          PY
          rm .github/ui-review-part-1 .github/ui-review-part-2 .github/ui-review-ready .github/workflows/ui-review-apply.yml
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Commit source and remove all temporary transport files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: refine facility decisions, comparisons, rosters and cargo routes'
          git push origin HEAD:codex/facility-ui-refinement
