name: Export visual workspace
on:
  push:
    branches: [feat/discovery-visuals]
    paths: [.github/workflows/export-visual-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package source and local dependencies
        run: |
          git archive --format=tar HEAD > /tmp/source.tar
          tar -czf /tmp/visual-workspace.tar.gz node_modules -C /tmp source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: visual-workspace
          path: /tmp/visual-workspace.tar.gz
          retention-days: 1
