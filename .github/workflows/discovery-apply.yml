name: Apply discovery implementation
on:
  push:
    branches: [feat/meaningful-discoveries]
    paths: [.github/workflows/discovery-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode and verify implementation patch
        shell: bash
        run: |
          cat .discovery-transfer/part-{1,2,3,4,5} | base64 -d | xz -d > /tmp/discovery.patch
          echo 'c40b81b6f9750632bca2d0a865a8151dbd2db221b4c02fc3b6e2ca25bb2f1014  /tmp/discovery.patch' | sha256sum -c -
          git apply --check /tmp/discovery.patch
          git apply /tmp/discovery.patch
          rm -rf .discovery-transfer .github/workflows/discovery-apply.yml
      - run: npm ci
      - name: Regenerate reproducible balance results
        run: npm run balance:report
      - name: Verify complete source tree and commit
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          TREE=$(git write-tree)
          echo "Implementation tree: $TREE"
          test "$TREE" = cfa891f708ff303323ca1155e99871ffff694b3a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add ore quality, early equipment and persistent physical discoveries'
          git push origin HEAD:feat/meaningful-discoveries
          git rev-parse HEAD
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Browser validation
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: discovery-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
