name: UI workspace
on:
  push:
    branches: ['codex/canvas-hud-elevator']
    paths: ['.github/workflows/ui-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive HEAD | gzip > /tmp/ui-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ui-source
          path: /tmp/ui-source.tar.gz
          retention-days: 1
