name: Discovery implementation workspace
on:
  push:
    branches: [feat/meaningful-discoveries]
    paths: [.github/workflows/discovery-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Export tracked source and installed dependencies without Git credentials
        run: |
          mkdir -p /tmp/discovery-workspace
          git archive HEAD | tar -x -C /tmp/discovery-workspace
          cp -a node_modules /tmp/discovery-workspace/
          tar -czf /tmp/discovery-workspace.tgz -C /tmp/discovery-workspace .
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-workspace
          path: /tmp/discovery-workspace.tgz
          retention-days: 1
