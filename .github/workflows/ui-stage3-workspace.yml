name: UI stage 3 workspace
on:
  push:
    branches: [codex/canvas-management]
    paths: [.github/workflows/ui-stage3-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Recover saved implementation chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/recovered
          for sha in 59e817af095498c0b06496e5e9dcee9053e23ada 67457d8f01ff0f22e39af0cd5991d87fbcdff97e 717559b7e88aba5e5e7733506d672f8c1d04204e db148aa622553a3503f1daf3210cc348bba03110; do
            gh api repos/ivgtr/loop-shaft/git/blobs/$sha --jq '.content' | base64 -d > /tmp/recovered/$sha.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ui-stage3-recovered
          path: /tmp/recovered
          retention-days: 1
