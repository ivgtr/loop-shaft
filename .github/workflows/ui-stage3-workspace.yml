name: UI stage 3 workspace
on:
  push:
    branches: [codex/canvas-management]
    paths: [.github/workflows/ui-stage3-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Export locked dependencies for local validation
        run: tar -czf /tmp/loop-shaft-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: ui-stage3-deps
          path: /tmp/loop-shaft-deps.tar.gz
          retention-days: 1
