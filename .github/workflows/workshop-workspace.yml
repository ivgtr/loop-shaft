name: Workshop workspace
on:
  push:
    branches: ['codex/canvas-workshop']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package repository and installed test dependencies
        run: tar --exclude='./.git' --exclude='./.npmrc' -czf /tmp/workshop-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-workspace
          path: /tmp/workshop-workspace.tar.gz
          retention-days: 1
