name: Workshop workspace
on:
  push:
    branches: ['codex/canvas-workshop']
permissions:
  contents: write
jobs:
  apply-reviewed-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply the locally tested change set
        shell: bash
        run: |
          set -euo pipefail
          cat .workshop-stage1.?.gzpart > /tmp/workshop-stage1.patch.gz
          echo '0f62cef9360a29831c3b878b37012bcf1bba9660f3b24a9c2f7a762178da8137  /tmp/workshop-stage1.patch.gz' | sha256sum --check
          gzip -dc /tmp/workshop-stage1.patch.gz > /tmp/workshop-stage1.patch
          echo 'd95c8c2fea47f9b53ac0da61fd349ab0ea1af4bcd45e2759bf8467b2cacec15a  /tmp/workshop-stage1.patch' | sha256sum --check
          git apply --check /tmp/workshop-stage1.patch
          git apply --whitespace=error /tmp/workshop-stage1.patch
          git rm .workshop-stage1.?.gzpart .github/workflows/workshop-workspace.yml
          git add README.md docs src tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate workshop purchases and first-upgrade guidance into Canvas'
          git push origin HEAD:codex/canvas-workshop
          git rev-parse HEAD
